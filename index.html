<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kişisel Kütüphane Yönetimi</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="header-content">
                <div class="header-text">
                    <h1><i class="bi bi-book-half"></i> Kütüphanem</h1>
                    <p>Kitaplarını ekle, kategorilere ayır ve okuma durumunu takip et</p>
                </div>
                <button class="btn btn-add-book" onclick="addBooksModalOpen()">
                    <i class="bi bi-plus-lg"></i> Yeni Kitap Ekle
                </button>
            </div>
        </header>

        <!-- İstatistik Kartları -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon bg-primary-gradient">
                    <i class="bi bi-collection"></i>
                </div>
                <div class="stat-info">
                    <span class="stat-value" id="totalBooks">0</span>
                    <span class="stat-label">Toplam Kitap</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon bg-pink-gradient">
                    <i class="bi bi-bookmark"></i>
                </div>
                <div class="stat-info">
                    <span class="stat-value" id="readingBooks">0</span>
                    <span class="stat-label">Okunuyor</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon bg-blue-gradient">
                    <i class="bi bi-check-circle"></i>
                </div>
                <div class="stat-info">
                    <span class="stat-value" id="readBooks">0</span>
                    <span class="stat-label">Okundu</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon bg-yellow-gradient">
                    <i class="bi bi-clock"></i>
                </div>
                <div class="stat-info">
                    <span class="stat-value" id="unreadBooks">0</span>
                    <span class="stat-label">Okunacak</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon bg-green-gradient">
                    <i class="bi bi-star"></i>
                </div>
                <div class="stat-info">
                    <span class="stat-value" id="averageRating">0</span>
                    <span class="stat-label">Ortalama Puan</span>
                </div>
            </div>
        </div>

        <!-- Filtreleme ve Sıralama Bölümü -->
        <div class="filter-section">
            <div class="filter-header">
                <div class="filter-title">
                    <i class="bi bi-funnel"></i>
                    <span>Kitapları Filtrele</span>
                </div>
                <button class="btn-filter-reset" onclick="resetFilters()">
                    <i class="bi bi-arrow-counterclockwise"></i> Sıfırla
                </button>
            </div>
            
            <div class="filter-body">
                <div class="filter-group">
                    <div class="filter-item search-box">
                        <i class="bi bi-search"></i>
                        <input type="text" id="searchInput" placeholder="Kitap veya yazar ara..." oninput="handleSearchInput()">
                    </div>
                </div>

                <div class="filter-group">
                    <div class="filter-item">
                        <label><i class="bi bi-tag"></i> Kategori</label>
                        <select id="categoryFilter" onchange="filterBooks()">
                            <option value="tum">📚 Tümü</option>
                            <option value="roman">📖 Roman</option>
                            <option value="bilim-kurgu">🚀 Bilim Kurgu</option>
                            <option value="fantastik">🧙 Fantastik</option>
                            <option value="bilim">🔬 Bilim</option>
                            <option value="tarih">⏳ Tarih</option>
                            <option value="felsefe">🧠 Felsefe</option>
                            <option value="psikoloji">💖 Psikoloji</option>
                            <option value="kisisel-gelisim">📈 Kişisel Gelişim</option>
                            <option value="biyografi">👤 Biyografi</option>
                            <option value="siir">🪶 Şiir</option>
                            <option value="diger">📌 Diğer</option>
                        </select>
                    </div>

                    <div class="filter-item">
                        <label><i class="bi bi-bookmark"></i> Durum</label>
                        <select id="statusFilter" onchange="filterBooks()">
                            <option value="tum">📌 Tümü</option>
                            <option value="Okunacak">⏳ Okunacak</option>
                            <option value="Okunuyor">👀 Okunuyor</option>
                            <option value="Okundu">✅ Okundu</option>
                        </select>
                    </div>

                    <div class="filter-item">
                        <label><i class="bi bi-star"></i> Puan</label>
                        <select id="ratingFilter" onchange="filterBooks()">
                            <option value="tum">⭐ Tümü</option>
                            <option value="5">⭐⭐⭐⭐⭐</option>
                            <option value="4">⭐⭐⭐⭐ ve üzeri</option>
                            <option value="3">⭐⭐⭐ ve üzeri</option>
                            <option value="2">⭐⭐ ve üzeri</option>
                            <option value="1">⭐ ve üzeri</option>
                        </select>
                    </div>

                    <div class="filter-item">
                        <label><i class="bi bi-arrow-up-down"></i> Sıralama</label>
                        <select id="sortFilter" onchange="filterBooks()">
                            <option value="en-yeni">🆕 En Yeni</option>
                            <option value="en-eski">📅 En Eski</option>
                            <option value="alfabetik-a-z">🔤 A-Z</option>
                            <option value="alfabetik-z-a">🔤 Z-A</option>
                            <option value="puan-azalan">⭐ Puana Göre (Azalan)</option>
                            <option value="puan-artan">⭐ Puana Göre (Artan)</option>
                            <option value="sayfa-azalan">📄 Sayfa (Azalan)</option>
                            <option value="sayfa-artan">📄 Sayfa (Artan)</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <!-- Modal - Kitap Ekleme/Düzenleme -->
        <div class="modal fade" id="addBookModal" tabindex="-1">
            <div class="modal-dialog modal-lg modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="modalTitle">
                            <i class="bi bi-plus-circle"></i> Yeni Kitap Ekle
                        </h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <form id="bookForm" novalidate>
                            <div class="row">
                                <div class="col-md-8 mb-3">
                                    <label class="form-label">Kitap Adı *</label>
                                    <input type="text" id="bookTitle" class="form-control" placeholder="Kitap adını girin" required>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Yazar *</label>
                                    <input type="text" id="bookAuthor" class="form-control" placeholder="Yazar adı" required>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Kategori</label>
                                    <select id="bookCategory" class="form-select">
                                        <option value="roman">Roman</option>
                                        <option value="bilim-kurgu">Bilim Kurgu</option>
                                        <option value="fantastik">Fantastik</option>
                                        <option value="bilim">Bilim</option>
                                        <option value="tarih">Tarih</option>
                                        <option value="felsefe">Felsefe</option>
                                        <option value="psikoloji">Psikoloji</option>
                                        <option value="kisisel-gelisim">Kişisel Gelişim</option>
                                        <option value="biyografi">Biyografi</option>
                                        <option value="siir">Şiir</option>
                                        <option value="diger">Diğer</option>
                                    </select>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">ISBN</label>
                                    <input type="text" id="bookIsbn" class="form-control" placeholder="ISBN numarası" maxlength="17">
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Sayfa Sayısı</label>
                                    <input type="number" id="bookPages" class="form-control" placeholder="Sayfa sayısı" min="0">
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Okuma Durumu</label>
                                    <select id="bookStatus" class="form-select">
                                        <option>Okunacak</option>
                                        <option>Okunuyor</option>
                                        <option>Okundu</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Puan</label>
                                    <select id="bookRating" class="form-select">
                                        <option value="">Puan Verme</option>
                                        <option value="1">⭐ 1 - Kötü</option>
                                        <option value="2">⭐⭐ 2 - İdare Eder</option>
                                        <option value="3">⭐⭐⭐ 3 - Orta</option>
                                        <option value="4">⭐⭐⭐⭐ 4 - İyi</option>
                                        <option value="5">⭐⭐⭐⭐⭐ 5 - Harika</option>
                                    </select>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Notlar</label>
                                <textarea id="bookNotes" class="form-control" rows="3" placeholder="Kitap hakkında notlarınız..."></textarea>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                            <i class="bi bi-x-lg"></i> İptal
                        </button>
                        <button type="button" id="saveBookBtn" class="btn btn-save">
                            <i class="bi bi-check-lg"></i> Kaydet
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Düzenleme ID'si için gizli input -->
        <input type="hidden" id="editId" value="">

        <!-- Kitap Listesi -->
        <div class="books-grid" id="booksGrid">
            <!-- Kitaplar JavaScript ile buraya gelecek -->
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="app.js"></script>
</body>
</html>
